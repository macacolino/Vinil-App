# Mantém o projeto Supabase "ativo": o plano gratuito pausa projetos sem
# atividade por 7 dias. Uma leitura simples com a chave anon NÃO bastou (o
# projeto foi pausado mesmo assim), então agora é feita uma gravação real,
# pela função keepalive() definida em supabase/schema.sql, duas vezes por dia.
# Também roda à mão: aba Actions → "Manter Supabase ativo" → "Run workflow".
name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gravação no banco via função keepalive()
        env:
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Endereço fixo do projeto (o secret VITE_SUPABASE_URL guarda a URL do site, não do Supabase).
          SUPABASE_URL: https://lxaqiarpkixiakicpysn.supabase.co
        run: |
          set -e
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secret VITE_SUPABASE_ANON_KEY não configurado." >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keepalive")
          echo "keepalive(): HTTP $code, resposta: $(cat /tmp/resp.txt)"
          if [ "$code" = "404" ]; then
            echo "::error::A função keepalive() não existe no banco. Cole supabase/schema.sql no SQL Editor do Supabase e rode." >&2
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::O Supabase não respondeu 200. Se o projeto estiver pausado, restaure-o no painel (Restore project)." >&2
            exit 1
          fi
          # Chamada de autenticação, para o serviço de auth também registrar uso.
          auth=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/settings")
          echo "Auth: HTTP $auth"
