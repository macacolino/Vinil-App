# Publica o app no GitHub Pages a cada push nas branches abaixo.
# Endereço: https://macacolino.github.io/main/
name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sleepy-albattani-3pi081
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Só um deploy por vez; um novo push cancela o anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /main/
      # Pages devolve 404.html para caminhos desconhecidos; com uma cópia do
      # index.html, abrir /main/albuns/5 direto no navegador continua funcionando.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
